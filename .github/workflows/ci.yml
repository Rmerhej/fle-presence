# Intégration continue :
#  - à chaque push / pull request : compilation + tests
#  - sur la branche main : construction et publication de l'image Docker sur Docker Hub
#    (secrets à créer dans GitHub : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN)
#  - puis mise en ligne automatique sur le serveur, par SSH
#    (secrets : SERVEUR_HOTE, SERVEUR_UTILISATEUR, SERVEUR_CLE_SSH ; sans eux, cette étape est sautée)
name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et lancer les tests
        run: mvn -B verify

      - name: Rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: rapports-tests
          path: target/surefire-reports/

  docker:
    name: Image Docker
    needs: tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier la présence des secrets Docker Hub
        id: secrets
        run: |
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      # Image pour PC/serveurs classiques (amd64) ET pour Oracle Cloud Ampere (arm64)
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        if: steps.secrets.outputs.ok == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Étiquettes de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'rolandmerhej1' }}/fle-presence
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Construire (et publier si les secrets existent)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.secrets.outputs.ok == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploiement:
    name: Mise en ligne
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Une seule mise en ligne à la fois, dans l'ordre des push
    concurrency:
      group: deploiement
      cancel-in-progress: false
    steps:
      - name: Vérifier la présence des secrets du serveur
        id: secrets
        run: |
          if [ -n "${{ secrets.SERVEUR_CLE_SSH }}" ] && [ -n "${{ secrets.SERVEUR_HOTE }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets du serveur absents : mise en ligne automatique sautée."
          fi

      - name: Mettre à jour le serveur
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLE: ${{ secrets.SERVEUR_CLE_SSH }}
          HOTE: ${{ secrets.SERVEUR_HOTE }}
          UTILISATEUR: ${{ secrets.SERVEUR_UTILISATEUR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          ssh-keyscan -H "$HOTE" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploiement "${UTILISATEUR:-ubuntu}@$HOTE" 'bash -s' <<'FIN'
            set -e
            cd ~/fle-presence
            git pull --ff-only
            # Toutes les images : l'application, et aussi les correctifs de MySQL 8.0 et de Caddy
            docker compose pull
            docker compose up -d --remove-orphans
            # Caddy relit sa configuration (en-têtes de sécurité…) sans couper le site
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            docker image prune -f > /dev/null
            # Attendre que l'application réponde (au plus 3 minutes)
            DOMAINE=$(grep '^DOMAINE=' .env | cut -d= -f2-)
            for i in $(seq 1 36); do
              if curl -fsS "https://$DOMAINE/actuator/health" | grep -q UP; then
                echo "Application en ligne et en bonne santé."
                exit 0
              fi
              sleep 5
            done
            echo "L'application ne répond pas après la mise à jour."
            docker compose logs --tail 80 app
            exit 1
          FIN

# Mise en ligne : à combiner avec docker-compose.yml
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# - Caddy reçoit le trafic sur les ports 80/443 et gère le HTTPS automatiquement
# - l'application n'est plus exposée directement
# - l'image est téléchargée depuis Docker Hub (pas de compilation sur le serveur)
# Journaux des conteneurs limités (RGPD : ils peuvent contenir des adresses IP et des identifiants).
# 3 fichiers de 10 Mo au plus par conteneur : les plus anciennes lignes sont effacées automatiquement.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    ports: !reset []

  app:
    build: !reset null
    image: ${APP_IMAGE:-rolandmerhej1/fle-presence:latest}
    pull_policy: always
    ports: !reset []

  # phpMyAdmin ne démarre pas sur le serveur (inutile en production).
  # Pour l'utiliser exceptionnellement : docker compose --profile outils up -d phpmyadmin
  phpmyadmin:
    profiles: ["outils"]

  caddy:
    logging: *journaux
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAINE: ${DOMAINE:?Définir DOMAINE dans .env (ex. cours.mon-association.fr)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Le dossier entier (et non le seul fichier) : après un « git pull », Caddy voit bien
      # la nouvelle version du Caddyfile (un fichier monté seul garderait l'ancienne).
      - ./deploiement:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config

  # Copie de chaque sauvegarde HORS du serveur (Oracle Object Storage), puis signal à Healthchecks.io.
  # Sans SAUVEGARDE_PAR_URL dans .env, le service ne fait rien.
  envoi-sauvegardes:
    logging: *journaux
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    user: root
    environment:
      PAR_URL: ${SAUVEGARDE_PAR_URL:-}
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL:-}
    volumes:
      - ./sauvegardes:/sauvegardes:ro
      - envois:/etat
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$PAR_URL" ]; then echo "SAUVEGARDE_PAR_URL vide : aucune copie hors du serveur."; while true; do sleep 3600; done; fi
        while true; do
          for f in /sauvegardes/*.sql.gz; do
            [ -f "$$f" ] || continue
            nom=$$(basename "$$f")
            [ -f "/etat/$$nom" ] && continue
            if curl -fsS --retry 3 -T "$$f" "$${PAR_URL%/}/$$nom" >/dev/null; then
              touch "/etat/$$nom"
              echo "Copie hors serveur OK : $$nom"
              [ -n "$$HEALTHCHECKS_URL" ] && curl -fsS --retry 3 "$$HEALTHCHECKS_URL" >/dev/null
            else
              echo "ÉCHEC de la copie : $$nom"
              [ -n "$$HEALTHCHECKS_URL" ] && curl -fsS --retry 3 "$$HEALTHCHECKS_URL/fail" >/dev/null
            fi
          done
          sleep 600
        done

volumes:
  caddy-data:
  caddy-config:
  envois:

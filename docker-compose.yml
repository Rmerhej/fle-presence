# FLE Présence : application + MySQL 8 + phpMyAdmin + sauvegardes
#   1. cp .env.example .env   (puis choisir les mots de passe)
#   2a. Tout dans Docker :        docker compose up -d --build
#   2b. Développer dans IntelliJ : docker compose up -d db phpmyadmin sauvegarde
#       (l'application lancée par IntelliJ utilise la base sur 127.0.0.1:3310)
#   Application : http://localhost:8080      phpMyAdmin : http://localhost:8081
name: fle-presence

# Journaux des conteneurs limités (RGPD : ils peuvent contenir des adresses IP et des identifiants).
# 3 fichiers de 10 Mo au plus par conteneur : les plus anciennes lignes sont effacées automatiquement.
x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    logging: *journaux
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fle_presence
      MYSQL_USER: ${DB_USER:-fle}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Définir DB_ROOT_PASSWORD dans .env}
      TZ: Europe/Paris
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    # Accessible uniquement depuis cet ordinateur (pour IntelliJ) ; fermé sur le serveur (prod).
    ports:
      - "127.0.0.1:${DB_PORT:-3310}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    logging: *journaux
    build: .
    image: ${APP_IMAGE:-rolandmerhej1/fle-presence:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/fle_presence?serverTimezone=Europe/Paris&characterEncoding=UTF-8
      DB_USER: ${DB_USER:-fle}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Définir APP_ADMIN_PASSWORD dans .env}
      APP_LIEN_FRENCH_FOR_BEGINNERS: ${APP_LIEN_FRENCH_FOR_BEGINNERS:-}
      APP_LIEN_BENEVOLAT: ${APP_LIEN_BENEVOLAT:-}
      APP_LIEN_FACEBOOK: ${APP_LIEN_FACEBOOK:-}
      APP_LIEN_INSTAGRAM: ${APP_LIEN_INSTAGRAM:-}
      APP_LIEN_LINKEDIN: ${APP_LIEN_LINKEDIN:-}
      APP_LIEN_YOUTUBE: ${APP_LIEN_YOUTUBE:-}
      APP_LIEN_X: ${APP_LIEN_X:-}
      APP_NOTIFICATIONS_SUJET: ${APP_NOTIFICATIONS_SUJET:-https://www.secours-catholique.org}
      TZ: Europe/Paris
    ports:
      - "${APP_PORT:-8080}:8080"

  # Sauvegarde automatique de la base : chaque nuit dans ./sauvegardes, 14 dernières conservées
  sauvegarde:
    logging: *journaux
    image: mysql:8.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Paris
      HEURE_SAUVEGARDE: ${HEURE_SAUVEGARDE:-02}
      CONSERVER: ${SAUVEGARDES_CONSERVEES:-14}
    volumes:
      - ./sauvegardes:/sauvegardes
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sauvegarder() {
          fichier="/sauvegardes/fle_presence_$$(date +%Y-%m-%d_%H%M).sql.gz"
          # Fichier temporaire, puis renommage : un fichier .sql.gz n'existe que si la sauvegarde
          # est complète (l'envoi hors du serveur ne voit jamais de fichier à moitié écrit).
          if mysqldump -h db -uroot --single-transaction --routines --no-tablespaces fle_presence > /tmp/dump.sql \
             && grep -q "Dump completed" /tmp/dump.sql \
             && gzip -c /tmp/dump.sql > "$$fichier.tmp" && mv "$$fichier.tmp" "$$fichier"; then
            echo "Sauvegarde OK : $$fichier"
          else
            echo "ÉCHEC de la sauvegarde" ; rm -f "$$fichier.tmp"
          fi
          rm -f /tmp/dump.sql
          ls -1t /sauvegardes/*.sql.gz 2>/dev/null | tail -n +$$((CONSERVER + 1)) | while read -r ancien; do rm -f "$$ancien"; done
        }
        sauvegarder
        while true; do
          sleep 3000
          if [ "$$(date +%H)" = "$$HEURE_SAUVEGARDE" ] && [ ! -f "/tmp/fait-$$(date +%F)" ]; then
            sauvegarder && touch "/tmp/fait-$$(date +%F)"
          fi
        done

  phpmyadmin:
    logging: *journaux
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      # Accessible uniquement depuis cet ordinateur
      - "127.0.0.1:${PMA_PORT:-8081}:80"

volumes:
  db-data:

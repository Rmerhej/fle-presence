# Profil "dev" : base H2 en mémoire + données de démonstration.
# Lancer avec : mvn spring-boot:run -Dspring-boot.run.profiles=dev
spring.datasource.url=jdbc:h2:mem:fle;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.thymeleaf.cache=false
logging.level.fr.asso.fle=DEBUG

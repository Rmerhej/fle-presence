spring.application.name=FLE Présence

# ---------------------------------------------------------------- MySQL
# Valeurs surchargeables par variables d'environnement (DB_URL, DB_USER, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3310/fle_presence?createDatabaseIfNotExist=true&serverTimezone=Europe/Paris&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:fle}
spring.datasource.password=${DB_PASSWORD:fle}

# Le schéma est géré par Flyway (src/main/resources/db/migration)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Paris

# ---------------------------------------------------------------- Application
# Premier démarrage : compte administrateur créé automatiquement.
# Sans APP_ADMIN_PASSWORD, un mot de passe aléatoire est affiché dans les logs.
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ---------------------------------------------------------------- Liens du pied de page
# Un lien laissé vide n'est pas affiché. Réglables par variables d'environnement APP_LIEN_...
app.liens.association=${APP_LIEN_ASSOCIATION:https://www.secours-catholique.org}
app.liens.association-nom=${APP_LIEN_ASSOCIATION_NOM:Secours Catholique}
app.liens.benevolat=${APP_LIEN_BENEVOLAT:}
app.liens.french-for-beginners=${APP_LIEN_FRENCH_FOR_BEGINNERS:}
app.liens.facebook=${APP_LIEN_FACEBOOK:}
app.liens.instagram=${APP_LIEN_INSTAGRAM:}
app.liens.linkedin=${APP_LIEN_LINKEDIN:}
app.liens.youtube=${APP_LIEN_YOUTUBE:}
app.liens.x=${APP_LIEN_X:}

# ---------------------------------------------------------------- Notifications push
# Clés générées automatiquement au premier usage. « sujet » : un email de contact (mailto:...)
# ou l'adresse du site, transmis aux services de notification (Google, Apple, Mozilla).
app.notifications.actives=${APP_NOTIFICATIONS_ACTIVES:true}
app.notifications.sujet=${APP_NOTIFICATIONS_SUJET:https://www.secours-catholique.org}

# Derrière un proxy HTTPS (Caddy, Nginx) : adresses et liens générés en https://
server.forward-headers-strategy=native

server.port=${PORT:8080}
server.servlet.session.timeout=2h
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=true
spring.web.locale=fr_FR
